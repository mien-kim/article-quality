<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>K-Culture - 영문 기사 품질 분석</title>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/highcharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/modules/accessibility.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--border:#2a3a5e;--text:#e8e8e8;--text2:#a8b2c1;--text3:#6b7a8d;--accent:#a78bfa;--green:#66bb6a;--yellow:#fdd835;--orange:#ff9800;--red:#ef5350}
*{box-sizing:border-box}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);margin:0;padding:24px 32px;font-size:16px;line-height:1.6}
.nav{margin-bottom:20px}
.nav a{color:var(--accent);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.nav a:hover{text-decoration:underline}
h1{font-size:26px;font-weight:700;margin:0 0 4px}
h1 i{color:var(--accent);margin-right:8px}
.sub{color:var(--text3);font-size:14px;margin-bottom:20px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px;padding:14px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:10px}
.controls label{font-size:12px;color:var(--text3)}
.controls input[type=date]{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;font-size:13px}
.controls button{background:var(--accent);color:#000;border:none;padding:7px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.controls button:hover{opacity:0.9}
.quick-btns{display:flex;gap:6px}
.qb{padding:5px 11px;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;background:var(--bg);color:var(--text2)}
.qb.on{background:rgba(167,139,250,0.15);color:var(--accent);border-color:rgba(167,139,250,0.4)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.kpi-l{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3)}
.kpi-v{font-size:26px;font-weight:700;font-family:'SF Mono',Consolas,monospace;margin:3px 0}
.kpi-s{font-size:12px;color:var(--text2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.c{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}
.tbl-wrap{max-height:550px;overflow-y:auto;border-radius:10px;background:var(--bg2);border:1px solid var(--border);padding:14px}
table.m{width:100%;border-collapse:collapse;font-size:13px}
table.m th{text-align:left;color:var(--text3);font-weight:500;padding:9px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;position:sticky;top:0;background:var(--bg2);z-index:1}
table.m td{padding:9px;border-bottom:1px solid rgba(42,58,94,0.5);vertical-align:top}
table.m tr:hover td{background:rgba(167,139,250,0.05)}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-weight:700;font-size:12px;font-family:'SF Mono',Consolas,monospace}
.b-h{background:rgba(102,187,106,0.2);color:var(--green)}
.b-m{background:rgba(253,216,53,0.2);color:var(--yellow)}
.b-w{background:rgba(255,152,0,0.2);color:var(--orange)}
.b-l{background:rgba(239,83,80,0.2);color:var(--red)}
a.lnk{color:var(--accent);text-decoration:none;font-size:13px}
.loading{text-align:center;padding:50px;color:var(--text3);font-size:14px}
.empty{text-align:center;padding:40px;color:var(--text3)}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}

.top-nav{display:flex;align-items:center;gap:24px;padding:12px 20px;background:rgba(15,15,26,0.95);border-bottom:1px solid rgba(255,255,255,0.08);margin:-24px -32px 24px;padding:14px 32px;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.nav-logo{color:#f0f0f5;text-decoration:none;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav-logo i{color:#6c8cff}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-link{color:#a0a0c0;text-decoration:none;font-size:13px;padding:6px 14px;border-radius:6px;transition:all 0.15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.nav-link:hover{background:rgba(255,255,255,0.06);color:#f0f0f5}
.nav-link.active{background:rgba(108,140,255,0.15);color:#6c8cff}
@media(max-width:700px){.top-nav{flex-direction:column;gap:10px}.nav-links{margin-left:0;flex-wrap:wrap}}


.row-clickable{cursor:pointer}
.row-clickable:hover td{background:rgba(167,139,250,0.08)}
.issue-row{display:none}
.issue-row.open{display:table-row}
.issue-row td{padding:12px 16px;background:rgba(167,139,250,0.03);border-left:3px solid var(--accent)}
.issue-detail{font-size:13px;line-height:1.8}
.issue-item-d{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(42,58,94,0.3)}
.issue-item-d:last-child{border-bottom:none;margin-bottom:0}
.issue-sev{display:inline-block;margin-right:6px}
.issue-cat{color:var(--text2);font-size:12px}
.issue-ba{margin:4px 0 0 20px;font-size:12px;color:var(--text2)}
.issue-ba strong{color:var(--text)}
.no-issues{color:var(--text3);font-style:italic;font-size:12px}
.expand-icon{color:var(--text3);font-size:11px;transition:transform 0.2s}
.expand-icon.open{transform:rotate(90deg)}
</style>
</head>
<body>
<nav class="top-nav">
  <a href="index.html" class="nav-logo"><i class="fa-solid fa-chart-line"></i> 경향신문 기사 품질 분석</a>
  <div class="nav-links">
    <a href="kyunghyang-english.html" class="nav-link" id="nav-kh"><i class="fa-solid fa-globe"></i> Kyunghyang English</a>
    <a href="k-culture.html" class="nav-link" id="nav-kc"><i class="fa-solid fa-film"></i> K-Culture</a>
    <a href="editorial-standards.html" class="nav-link" id="nav-std"><i class="fa-solid fa-spell-check"></i> 경향 보도 기준</a>
    <a href="auto-translate.html" class="nav-link" id="nav-at"><i class="fa-solid fa-language"></i> Auto Translate</a>
  </div>
</nav>

<h1><i class="fa-solid fa-film"></i>K-Culture</h1>
<p class="sub">스포츠경향 K-Culture 영문 기사 품질 분석 · 엔터테인먼트 · 음악 · 영화 · TV | Supabase 실시간 조회</p>

<div class="controls">
<label>시작일</label><input type="date" id="dateFrom">
<label>종료일</label><input type="date" id="dateTo">
<button onclick="loadData()">조회</button>
<div class="quick-btns">
<div class="qb" onclick="setRange('today')">오늘</div>
<div class="qb" onclick="setRange('week')">이번 주</div>
<div class="qb on" onclick="setRange('lastweek')">지난 주</div>
<div class="qb" onclick="setRange('month')">이번 달</div>
</div>
</div>

<div class="kpis">
<div class="kpi"><div class="kpi-l">분석 기사</div><div class="kpi-v" id="k-count">-</div><div class="kpi-s">건</div></div>
<div class="kpi"><div class="kpi-l">평균 점수</div><div class="kpi-v" id="k-avg">-</div><div class="kpi-s">/100</div></div>
<div class="kpi"><div class="kpi-l">평균 FK</div><div class="kpi-v" id="k-fk">-</div><div class="kpi-s">목표 8~12</div></div>
<div class="kpi"><div class="kpi-l">70점 이상</div><div class="kpi-v" id="k-pass">-</div><div class="kpi-s" id="k-pass-pct"></div></div>
<div class="kpi"><div class="kpi-l">게시보류</div><div class="kpi-v" id="k-hold">-</div><div class="kpi-s">&lt;60점</div></div>
</div>

<div class="g2">
<div class="c"><div id="chart-dist" style="height:220px"></div></div>
<div class="c"><div id="chart-daily" style="height:220px"></div></div>
</div>

<div class="tbl-wrap">
<table class="m">
<thead><tr><th></th><th>점수</th><th>제목 / 기자</th><th>FK</th><th>날짜</th><th>링크</th></tr></thead>
<tbody id="tbl"></tbody>
</table>
</div>

<div class="loading" id="loading" style="display:none">데이터 로딩 중...</div>
<div class="empty" id="empty" style="display:none">선택한 기간에 데이터가 없습니다.</div>

<script>
var SUPABASE_URL='https://wwaflpepyrlfdcxvtscp.supabase.co';
var SUPABASE_KEY = 'REDACTED_JWT'; 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3YWZscGVweXJsZmRjeHZ0c2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDk0NjEsImV4cCI6MjEwMTUyNTQ2MX0.0E68M0hqgH1tWmWmSE1Cs9MTYqLaOTBsjen0d2rnjGE';
var allData=[];

function fmt(d){return d.toISOString().split('T')[0]}
function getLastWeek(){var now=new Date(),day=now.getDay()||7;var m=new Date(now);m.setDate(now.getDate()-day-6);var s=new Date(m);s.setDate(m.getDate()+6);return{from:fmt(m),to:fmt(s)}}

function setRange(r){
  document.querySelectorAll('.qb').forEach(function(b){b.classList.remove('on')});
  event.target.classList.add('on');
  var now=new Date(),f,t;
  if(r==='today'){f=t=fmt(now)}
  else if(r==='week'){var d=now.getDay()||7;f=fmt(new Date(now.getFullYear(),now.getMonth(),now.getDate()-d+1));t=fmt(now)}
  else if(r==='lastweek'){var lw=getLastWeek();f=lw.from;t=lw.to}
  else if(r==='month'){f=fmt(new Date(now.getFullYear(),now.getMonth(),1));t=fmt(now)}
  document.getElementById('dateFrom').value=f;
  document.getElementById('dateTo').value=t;
  loadData();
}

async function loadData(){
  var from=document.getElementById('dateFrom').value;
  var to=document.getElementById('dateTo').value;
  if(!from||!to)return;
  document.getElementById('loading').style.display='block';
  document.getElementById('tbl').innerHTML='';
  var url=SUPABASE_URL+'/rest/v1/english_article_quality?select=*&source=eq.kc&published_at=gte.'+from+'T00:00:00&published_at=lte.'+to+'T23:59:59&order=published_at.desc';
  try{var r=await fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});allData=await r.json()}catch(e){allData=[]}
  document.getElementById('loading').style.display='none';
  document.getElementById('empty').style.display=allData.length?'none':'block';
  render();
}

function render(){
  if(!allData.length){['k-count','k-avg','k-fk','k-pass','k-hold'].forEach(function(id){document.getElementById(id).textContent='-'});return}
  var avg=Math.round(allData.reduce(function(s,d){return s+d.score},0)/allData.length*10)/10;
  var fk=Math.round(allData.reduce(function(s,d){return s+(d.fk_grade||0)},0)/allData.length*10)/10;
  var pass=allData.filter(function(d){return d.score>=70}).length;
  var hold=allData.filter(function(d){return d.score<60}).length;
  document.getElementById('k-count').textContent=allData.length;
  document.getElementById('k-avg').textContent=avg;
  document.getElementById('k-avg').style.color=avg>=75?'#66bb6a':avg>=65?'#fdd835':'#ef5350';
  document.getElementById('k-fk').textContent=fk;
  document.getElementById('k-fk').style.color=fk<=12?'#66bb6a':fk<=14?'#ff9800':'#ef5350';
  document.getElementById('k-pass').textContent=pass;
  document.getElementById('k-pass-pct').textContent=Math.round(pass/allData.length*100)+'%';
  document.getElementById('k-hold').textContent=hold;

  var dist=[0,0,0,0];
  allData.forEach(function(d){if(d.score>=80)dist[0]++;else if(d.score>=70)dist[1]++;else if(d.score>=60)dist[2]++;else dist[3]++});
  Highcharts.chart('chart-dist',{chart:{type:'pie',backgroundColor:'transparent'},title:{text:'품질 분포',style:{fontSize:'14px',color:'#e8e8e8'}},plotOptions:{pie:{innerSize:'45%',dataLabels:{format:'<b>{point.name}</b> {point.y}건',style:{fontSize:'11px',color:'#a8b2c1',textOutline:'none'}}}},series:[{data:[{name:'우수80+',y:dist[0],color:'#66bb6a'},{name:'양호70-79',y:dist[1],color:'#fdd835'},{name:'개선60-69',y:dist[2],color:'#ff9800'},{name:'보류<60',y:dist[3],color:'#ef5350'}]}],credits:{enabled:false}});

  var daily={};allData.forEach(function(d){var day=d.published_at?d.published_at.split('T')[0]:'?';if(!daily[day])daily[day]={sum:0,cnt:0};daily[day].sum+=d.score;daily[day].cnt++});
  var days=Object.keys(daily).sort();
  Highcharts.chart('chart-daily',{chart:{backgroundColor:'transparent'},title:{text:'일별 추이',style:{fontSize:'14px',color:'#e8e8e8'}},xAxis:{categories:days.map(function(d){return d.slice(5)}),labels:{style:{color:'#6b7a8d'}},lineColor:'#2a3a5e'},yAxis:[{title:{text:null},min:50,max:90,gridLineColor:'#2a3a5e',labels:{style:{color:'#6b7a8d'}}},{title:{text:null},opposite:true,gridLineColor:'transparent',labels:{style:{color:'#6b7a8d'}}}],series:[{name:'평균',type:'spline',data:days.map(function(d){return Math.round(daily[d].sum/daily[d].cnt*10)/10}),color:'#a78bfa',lineWidth:2.5},{name:'건수',type:'column',data:days.map(function(d){return daily[d].cnt}),color:'rgba(167,139,250,0.25)',yAxis:1}],legend:{itemStyle:{color:'#a8b2c1'}},credits:{enabled:false}});

  var html='';
  allData.forEach(function(d,idx){
    var cls=d.score>=80?'b-h':d.score>=70?'b-m':d.score>=60?'b-w':'b-l';
    var dt=d.published_at?d.published_at.slice(5,16).replace('T',' '):'';
    var issues=d.issues||[];
    if(typeof issues==='string'){try{issues=JSON.parse(issues)}catch(e){issues=[]}}
    html+='<tr class="row-clickable" onclick="toggleIssue('+idx+')"><td><i class="fa-solid fa-chevron-right expand-icon" id="exp-'+idx+'"></i></td><td><span class="badge '+cls+'">'+d.score+'</span></td><td><span style="font-size:13px">'+d.title.slice(0,55)+'</span><br><span style="font-size:11px;color:#6b7a8d">'+(d.byline||'')+'</span></td><td style="font-family:monospace;color:'+(d.fk_grade<=12?'#66bb6a':d.fk_grade>14?'#ef5350':'#ff9800')+'">'+d.fk_grade+'</td><td style="font-size:12px;color:#6b7a8d;white-space:nowrap">'+dt+'</td><td><a class="lnk" href="'+d.url+'" target="_blank" onclick="event.stopPropagation()">원문</a></td></tr>';
    var issueHtml='';
    if(d.fk_grade>14) issueHtml+='<div class="issue-item-d"><span class="issue-sev">🟠</span><span class="issue-cat">가독성</span><div class="issue-ba"><strong>이슈:</strong> FK Grade '+d.fk_grade+' (목표 8~12 초과)</div><div class="issue-ba"><strong>개선:</strong> 긴 문장을 분리하고 어려운 단어를 쉬운 표현으로 교체</div></div>';
    if(d.score<60) issueHtml+='<div class="issue-item-d"><span class="issue-sev">🔴</span><span class="issue-cat">게시보류 권장</span><div class="issue-ba"><strong>이슈:</strong> 전체 점수 '+d.score+'점 (60점 미만)</div><div class="issue-ba"><strong>개선:</strong> 헤드라인, 문장 구조, 문화적 접근성 전반 개선 필요</div></div>';
    else if(d.score<70) issueHtml+='<div class="issue-item-d"><span class="issue-sev">🟡</span><span class="issue-cat">개선 필요</span><div class="issue-ba"><strong>이슈:</strong> 전체 점수 '+d.score+'점 (70점 미만)</div><div class="issue-ba"><strong>개선:</strong> 헤드라인 길이, 문장 구조 점검 권장</div></div>';
    issues.forEach(function(iss){
      var sev=iss.severity==='critical'?'🔴':iss.severity==='warning'?'🟠':'🟡';
      issueHtml+='<div class="issue-item-d"><span class="issue-sev">'+sev+'</span><span class="issue-cat">'+(iss.type||iss.category||'')+'</span>';
      if(iss.context) issueHtml+='<div class="issue-ba"><strong>Before:</strong> '+iss.context+'</div>';
      if(iss.replacement) issueHtml+='<div class="issue-ba"><strong>After:</strong> '+iss.replacement+'</div>';
      issueHtml+='</div>';
    });
    if(!issueHtml) issueHtml='<span class="no-issues">이슈 없음 — 양호</span>';
    html+='<tr class="issue-row" id="issue-'+idx+'"><td colspan="6"><div class="issue-detail">'+issueHtml+'</div></td></tr>';
  });
  document.getElementById('tbl').innerHTML=html;
}


function toggleIssue(idx){
  var row=document.getElementById('issue-'+idx);
  var icon=document.getElementById('exp-'+idx);
  if(row.classList.contains('open')){row.classList.remove('open');icon.classList.remove('open')}
  else{row.classList.add('open');icon.classList.add('open')}
}

(function(){var lw=getLastWeek();document.getElementById('dateFrom').value=lw.from;document.getElementById('dateTo').value=lw.to;loadData()})();

document.getElementById("nav-kc").classList.add("active");
</script>
</body>
</html>
