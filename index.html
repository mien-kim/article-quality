<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>기사 품질 분석 대시보드</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0f0f1a;--bg2:#161625;--surface:#1e1e32;--border:#2a2a45;--text:#f0f0f5;--text2:#a0a0c0;--text3:#6060a0;--accent:#6c8cff;--accent2:#a78bfa;--green:#4ade80;--orange:#fb923c;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
.header{text-align:center;margin-bottom:56px}
.header h1{font-size:32px;font-weight:800;letter-spacing:-0.02em;margin-bottom:8px}
.header h1 i{color:var(--accent);margin-right:10px}
.header p{color:var(--text3);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:960px;width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px 32px;text-align:center;cursor:pointer;transition:all 0.25s ease;position:relative;overflow:hidden;text-decoration:none;display:block}
.card::before{content:'';position:absolute;inset:0;border-radius:var(--radius);opacity:0;transition:opacity 0.3s}
.card:hover{transform:translateY(-6px);border-color:rgba(108,140,255,0.4);box-shadow:0 20px 60px rgba(108,140,255,0.12)}
.card:hover::before{opacity:1}
.card-icon{width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;position:relative;z-index:1}
.card-title{font-size:18px;font-weight:700;margin-bottom:8px;position:relative;z-index:1}
.card-desc{font-size:13px;color:var(--text2);line-height:1.5;position:relative;z-index:1}
.card-badge{display:inline-block;margin-top:14px;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:600;position:relative;z-index:1}
.card-kh .card-icon{background:rgba(108,140,255,0.15);color:var(--accent)}
.card-kh::before{background:linear-gradient(135deg,rgba(108,140,255,0.05),transparent)}
.card-kh .card-badge{background:rgba(108,140,255,0.15);color:var(--accent)}
.card-kc .card-icon{background:rgba(167,139,250,0.15);color:var(--accent2)}
.card-kc::before{background:linear-gradient(135deg,rgba(167,139,250,0.05),transparent)}
.card-kc .card-badge{background:rgba(167,139,250,0.15);color:var(--accent2)}
.card-std .card-icon{background:rgba(74,222,128,0.15);color:var(--green)}
.card-std::before{background:linear-gradient(135deg,rgba(74,222,128,0.05),transparent)}
.card-std .card-badge{background:rgba(74,222,128,0.15);color:var(--green)}
.footer{margin-top:56px;text-align:center;color:var(--text3);font-size:12px}
.footer a{color:var(--accent);text-decoration:none}
@media(max-width:720px){.cards{grid-template-columns:1fr;max-width:360px}.header h1{font-size:24px}}
</style>
</head>
<body>
<div class="header">
  <h1><i class="fa-solid fa-chart-line"></i>기사 품질 분석 대시보드</h1>
  <p>경향신문 디지털 콘텐츠 품질 모니터링 시스템</p>
</div>
<div class="cards">
  <a class="card card-kh" href="kyunghyang-english.html">
    <div class="card-icon"><i class="fa-solid fa-globe"></i></div>
    <div class="card-title">Kyunghyang English</div>
    <div class="card-desc">영문 기사 품질 분석<br>FK Grade · 문장 구조 · 문화적 접근성</div>
    <div class="card-badge">Supabase 실시간</div>
  </a>
  <a class="card card-kc" href="k-culture.html">
    <div class="card-icon"><i class="fa-solid fa-film"></i></div>
    <div class="card-title">K-Culture</div>
    <div class="card-desc">스포츠경향 K-Culture 영문 기사<br>엔터테인먼트 · 음악 · 영화 · TV</div>
    <div class="card-badge">Supabase 실시간</div>
  </a>
  <a class="card card-std" href="editorial-standards.html">
    <div class="card-icon"><i class="fa-solid fa-spell-check"></i></div>
    <div class="card-title">경향 보도 기준</div>
    <div class="card-desc">스타일가이드 · 젠더 보도 가이드라인<br>표기 및 맞춤법 검수</div>
    <div class="card-badge">국문 기사 검수</div>
  </a>
</div>
<div class="footer">
  <p>경향신문 서비스기획팀 · Made by mien.kim · Powered by Amazon Quick</p>
</div>
<script>
document.querySelectorAll('.card').forEach(function(card, i){
  card.style.opacity='0';card.style.transform='translateY(20px)';
  setTimeout(function(){card.style.transition='opacity 0.5s ease, transform 0.5s ease';card.style.opacity='1';card.style.transform='translateY(0)';}, 150 + i * 100);
});
</script>
</body>
</html>
