<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Translate - 자동 번역</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/highcharts.js"></script>

<style>
:root {
  --bg-primary: #0f1923;
  --bg-secondary: #1a2937;
  --bg-card: #1e3348;
  --text-primary: #e8edf3;
  --text-secondary: #94a3b8;
  --accent: #f59e0b;
  --accent-dim: #f59e0b33;
  --border: #2d4a5e;
  --success: #4ade80;
  --warning: #f59e0b;
  --danger: #f87171;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height:100vh; }
.top-nav { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 12px 24px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
.nav-logo { font-size:1.1rem; font-weight:700; color: var(--accent); white-space:nowrap; }
.nav-links { display:flex; gap:8px; flex-wrap:wrap; }
.nav-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; background: var(--bg-card); color: var(--text-secondary); text-decoration:none; font-size:0.85rem; font-weight:500; border:1px solid var(--border); transition: all 0.2s; }
.nav-btn:hover { background: var(--accent-dim); color: var(--text-primary); border-color: var(--accent); }
.nav-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight:600; }
.container { max-width:1400px; margin:0 auto; padding:24px; }
.page-title { margin-bottom:24px; }
.page-title h1 { font-size:1.8rem; font-weight:700; color: var(--text-primary); }
.page-title .subtitle { font-size:1rem; color: var(--text-secondary); margin-top:4px; }
.kpi-row { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:24px; }
.kpi-card { background: var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:20px; text-align:center; }
.kpi-card .kpi-value { font-size:1.8rem; font-weight:700; color: var(--accent); }
.kpi-card .kpi-label { font-size:0.8rem; color: var(--text-secondary); margin-top:4px; }
.chart-row { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:24px; }
.chart-box { background: var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:20px; min-height:320px; }
.filter-bar { background: var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:16px 20px; margin-bottom:24px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.filter-bar input[type="date"] { background: var(--bg-secondary); border:1px solid var(--border); color: var(--text-primary); padding:8px 12px; border-radius:6px; font-size:0.85rem; }
.filter-bar button { padding:8px 16px; border-radius:6px; border:1px solid var(--border); background: var(--bg-secondary); color: var(--text-secondary); cursor:pointer; font-size:0.8rem; transition:all 0.2s; }
.filter-bar button:hover, .filter-bar button.active { background: var(--accent); color:#fff; border-color: var(--accent); }
.btn-primary { background: var(--accent) !important; color:#fff !important; border-color: var(--accent) !important; font-weight:600; }
table { width:100%; border-collapse:collapse; font-size:0.85rem; }
th { background: var(--bg-secondary); color: var(--text-secondary); padding:12px; text-align:left; font-weight:600; border-bottom:1px solid var(--border); }
td { padding:12px; border-bottom:1px solid var(--border); color: var(--text-primary); }
tr:hover { background: var(--accent-dim); }
.table-wrap { background: var(--bg-card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.badge { display:inline-block; padding:3px 8px; border-radius:4px; font-size:0.75rem; font-weight:600; }
.badge-success { background:#4ade8033; color:#4ade80; }
.badge-warning { background:#f59e0b33; color:#f59e0b; }
.badge-danger { background:#f8717133; color:#f87171; }
a { color: var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
.footer { text-align:center; padding:32px; color: var(--text-secondary); font-size:0.8rem; border-top:1px solid var(--border); margin-top:40px; }
.issue-item { margin:2px 0; font-size:0.78rem; }
.issue-before { color: var(--danger); text-decoration: line-through; }
.issue-after { color: var(--success); }
@media (max-width:768px) {
  .chart-row { grid-template-columns: 1fr; }
  .nav-links { gap:4px; }
  .nav-btn span { display:none; }
}
</style>
</head>
<body>
<nav class="top-nav">
  <div class="nav-logo">경향신문 AI Newsroom Lab</div>
  <div class="nav-links">
    <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i><span>Home</span></a>
<a href="kyunghyang-english.html" class="nav-btn"><i class="fa-solid fa-globe"></i><span>Kyunghyang English</span></a>
<a href="k-culture.html" class="nav-btn"><i class="fa-solid fa-masks-theater"></i><span>K-Culture</span></a>
<a href="editorial-standards.html" class="nav-btn"><i class="fa-solid fa-scale-balanced"></i><span>경향 보도 기준</span></a>
<a href="auto-translate.html" class="nav-btn active"><i class="fa-solid fa-language"></i><span>Auto Translate</span></a>

  </div>
</nav>
<div class="container">
  <div class="page-title">
    <h1><i class="fa-solid fa-language" style="color:var(--accent);"></i> Auto Select &amp; Translate</h1>
    <p class="subtitle">자동 선별 및 번역 현황 · table=auto_translations</p>
  </div>

  <div class="filter-bar">
    <input type="date" id="startDate">
    <span style="color:var(--text-secondary);">~</span>
    <input type="date" id="endDate">
    <button class="btn-primary" onclick="fetchData()"><i class="fa-solid fa-magnifying-glass"></i> 조회</button>
    <button onclick="setQuick('today')">오늘</button>
    <button onclick="setQuick('week')">이번주</button>
    <button onclick="setQuick('lastweek')">지난주</button>
    <button onclick="setQuick('month')">이번달</button>
  </div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-value" id="kpiTotal">-</div><div class="kpi-label">번역 기사</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpiInterest">-</div><div class="kpi-label">평균 관심도</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpiQuality">-</div><div class="kpi-label">평균 품질</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpiFK">-</div><div class="kpi-label">평균 FK</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpiLocal">-</div><div class="kpi-label">현지화 적용</div></div>
  </div>

  <div class="chart-row">
    <div class="chart-box" id="chartCol"></div>
    <div class="chart-box" id="chartPie"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>관심도</th><th>품질</th><th>원본 → 번역 제목</th><th>선별 근거</th><th>섹션</th><th>날짜</th><th>상태</th><th>원문</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Preview modal -->
  <div id="previewModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;padding:40px;overflow-y:auto;" onclick="closePreview(event)">
    <div style="max-width:800px;margin:0 auto;background:var(--bg-card);border-radius:16px;padding:32px;border:1px solid var(--border);" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h3 style="color:var(--accent);"><i class="fa-solid fa-eye"></i> 번역 미리보기</h3>
        <button onclick="document.getElementById('previewModal').style.display='none'" style="background:none;border:none;color:var(--text-secondary);font-size:1.5rem;cursor:pointer;">&times;</button>
      </div>
      <div id="previewContent"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://wwaflpepyrlfdcxvtscp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3YWZscGVweXJsZmRjeHZ0c2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDk0NjEsImV4cCI6MjEwMTUyNTQ2MX0.0E68M0hqgH1tWmWmSE1Cs9MTYqLaOTBsjen0d2rnjGE';
const TABLE = 'auto_translations';

function cleanText(str) {
  if (!str) return '-';
  return str
    // Fix UTF-8 mojibake: em dash
    .replace(/â€"/g, '—')
    .replace(/â€\u0094/g, '—')
    .replace(/\u00e2\u0080\u0094/g, '—')
    .replace(/Ã¢â‚¬â€/g, '—')
    // Fix corrupted Korean (AI/encoding errors)
    .replace(/놙음/g, '높음')
    .replace(/놙/g, '높')
    .replace(/ë†™/g, '높')
    .replace(/랏랏랏동해얀/g, '')
    .replace(/기저/g, '기준')
    .replace(/젥문/g, '장문')
    .replace(/잡문/g, '장문')
    // Remove any remaining garbled sequences (non-standard chars between Korean)
    .replace(/랏/g, '·')
    .replace(/Â°/g, '°');
}


function supaFetch(query) {
  return fetch(`${SUPABASE_URL}/rest/v1/${query}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  }).then(r => r.json());
}

function setQuick(mode) {
  const now = new Date();
  let s, e;
  if (mode==='today') { s=e=now; }
  else if (mode==='week') { s=new Date(now); s.setDate(now.getDate()-now.getDay()); e=now; }
  else if (mode==='lastweek') { e=new Date(now); e.setDate(now.getDate()-now.getDay()-1); s=new Date(e); s.setDate(e.getDate()-6); }
  else if (mode==='month') { s=new Date(now.getFullYear(),now.getMonth(),1); e=now; }
  document.getElementById('startDate').value = s.toISOString().slice(0,10);
  document.getElementById('endDate').value = e.toISOString().slice(0,10);
  fetchData();
}

let allData = [];

async function fetchData() {
  const s = document.getElementById('startDate').value;
  const e = document.getElementById('endDate').value;
  let q = `${TABLE}?select=*&order=created_at.desc`;
  if (s) q += `&created_at=gte.${s}T00:00:00`;
  if (e) q += `&created_at=lte.${e}T23:59:59`;
  
  try {
    const data = await supaFetch(q);
    allData = data;
    renderDashboard(data);
  } catch(err) { console.error(err); }
}

function renderDashboard(data) {
  const total = data.length;
  const avgInterest = total ? (data.reduce((a,d)=>a+(d.interest_score||0),0)/total).toFixed(1) : '-';
  const avgQuality = total ? (data.reduce((a,d)=>a+(d.quality_score||0),0)/total).toFixed(1) : '-';
  const avgFK = total ? (data.reduce((a,d)=>a+(d.fk_grade||0),0)/total).toFixed(1) : '-';
  const localized = data.filter(d => d.localization_applied && Array.isArray(d.localization_applied) && d.localization_applied.length > 0).length;

  document.getElementById('kpiTotal').textContent = total;
  document.getElementById('kpiInterest').textContent = avgInterest;
  document.getElementById('kpiQuality').textContent = avgQuality;
  document.getElementById('kpiFK').textContent = avgFK;
  document.getElementById('kpiLocal').textContent = localized;

  // Column chart - interest distribution (0-100 scale)
  const buckets = [0,0,0,0,0]; // 0-39,40-54,55-69,70-84,85-100
  data.forEach(d => {
    const s = d.interest_score||0;
    if (s<40) buckets[0]++;
    else if (s<55) buckets[1]++;
    else if (s<70) buckets[2]++;
    else if (s<85) buckets[3]++;
    else buckets[4]++;
  });
  Highcharts.chart('chartCol', {
    chart:{type:'column',backgroundColor:'transparent'},
    title:{text:'관심도 분포',style:{color:'#e8edf3'}},
    xAxis:{categories:['0-39 (제외)','40-54','55-69','70-84','85-100'],labels:{style:{color:'#94a3b8'}}},
    yAxis:{title:{text:'기사 수',style:{color:'#94a3b8'}},labels:{style:{color:'#94a3b8'}}},
    series:[{name:'기사',data:buckets,color:'#f59e0b'}],
    legend:{enabled:false},
    credits:{enabled:false}
  });

  // Pie - sections
  const sections = {};
  data.forEach(d => {
    const sec = d.section || '기타';
    sections[sec] = (sections[sec]||0) + 1;
  });
  const pieData = Object.entries(sections).map(([name,y]) => ({name,y}));
  Highcharts.chart('chartPie', {
    chart:{type:'pie',backgroundColor:'transparent'},
    title:{text:'섹션별 분포',style:{color:'#e8edf3'}},
    series:[{name:'기사',data:pieData,innerSize:'50%'}],
    plotOptions:{pie:{dataLabels:{color:'#e8edf3',format:'{point.name}: {point.y}'}}},
    credits:{enabled:false}
  });

  // Table (dedup by original_url)
  const seen = new Set();
  const deduped = data.filter(d => {
    const key = d.original_url || d.original_title || d.id;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  let html = '';
  deduped.forEach((d, idx) => {
    const statusBadge = d.status === 'completed' ? '<span class="badge badge-success">완료</span>' :
                        d.status === 'review_needed' ? '<span class="badge badge-warning">검토</span>' :
                        d.status === 'rejected' ? '<span class="badge badge-danger">제외</span>' :
                        `<span class="badge badge-warning">${d.status||'대기'}</span>`;
    html += `<tr style="cursor:pointer;" onclick="showPreview(${idx})">
      <td><strong style="color:var(--accent);">${d.interest_score||'-'}</strong></td>
      <td>${d.quality_score||'-'}</td>
      <td>
        <div style="font-size:0.8rem;color:var(--text-secondary);">${d.original_title||''}</div>
        <div>${d.translated_title||''}</div>
      </td>
      <td style="font-size:0.78rem;color:var(--text-secondary);max-width:160px;">${cleanText(d.selection_reason)}</td>
      <td>${d.section||'-'}</td>
      <td>${(d.created_at||'').slice(0,10)}</td>
      <td>${statusBadge}</td>
      <td>${d.original_url?`<a href="${d.original_url}" target="_blank" title="원문 기사"><i class="fa-solid fa-newspaper"></i></a>`:'-'}</td>
    </tr>`;
  });
  document.getElementById('tableBody').innerHTML = html;
}

function showPreview(idx) {
  // idx refers to deduped array, rebuild it
  const seen2 = new Set();
  const deduped2 = allData.filter(d => { const k = d.original_url||d.original_title||d.id; if(seen2.has(k)) return false; seen2.add(k); return true; });
  const d = deduped2[idx];
  if (!d) return;
  let localHtml = '';
  if ((d.localization_applied && Array.isArray(d.localization_applied) && d.localization_applied.length > 0)) {
    localHtml = '<h4 style="color:var(--accent);margin-top:20px;"><i class="fa-solid fa-globe"></i> 현지화 적용 내역</h4><ul style="margin-top:8px;padding-left:20px;color:var(--text-secondary);font-size:0.85rem;">';
    d.localization_applied.forEach(l => {
      localHtml += `<li><span class="issue-before">${l.original||''}</span> → <span class="issue-after">${l.localized||''}</span></li>`;
    });
    localHtml += '</ul>';
  }
  document.getElementById('previewContent').innerHTML = `
    <p style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:8px;">${d.original_title||''}</p>
    <h3 style="margin-bottom:16px;">${d.translated_title||''}</h3>
    <div style="background:var(--bg-secondary);border-radius:8px;padding:12px;margin-bottom:16px;">
      <strong style="color:var(--accent);font-size:0.85rem;"><i class="fa-solid fa-bullseye"></i> 선별 근거</strong>
      <p style="color:var(--text-secondary);font-size:0.85rem;margin-top:6px;">${cleanText(d.selection_reason)}</p>
      <p style="color:var(--text-secondary);font-size:0.8rem;margin-top:4px;">관심도 점수: <strong style="color:var(--accent);">${d.interest_score||'-'}</strong>/100</p>
    </div>
    <div style="color:var(--text-secondary);font-size:0.9rem;line-height:1.8;white-space:pre-wrap;">${d.translated_body||d.body||'본문 없음'}</div>
    ${localHtml}
  `;
  document.getElementById('previewModal').style.display = 'block';
}

function closePreview(e) {
  if (e.target === document.getElementById('previewModal')) {
    document.getElementById('previewModal').style.display = 'none';
  }
}

document.addEventListener('DOMContentLoaded', () => { setQuick('month'); });
</script>
</body>
</html>
