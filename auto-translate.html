<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>자동번역 대시보드</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/highcharts.js"></script>
<style>
:root{--bg:#1a1d23;--bg2:#22262e;--surface:#2a2f38;--border:#353a44;--text:#e4e7ec;--accent:#f59e0b;--accent-dim:rgba(245,158,11,0.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.7rem 1.5rem;display:flex;align-items:center;flex-wrap:wrap;gap:0.8rem}
.nav-brand{display:flex;align-items:center;gap:0.6rem;margin-right:auto}
.nav-brand .flask{font-size:1.4rem;color:#4fc3f7}
.nav-brand .titles{display:flex;flex-direction:column}
.nav-brand .main-t{font-weight:700;font-size:1rem;color:var(--text)}
.nav-brand .sub-t{font-size:0.7rem;color:#888;margin-top:1px}
.nav-menu{display:flex;gap:0.4rem;flex-wrap:wrap}
.nav-btn{padding:0.45rem 1rem;border-radius:8px;font-size:0.82rem;font-weight:500;color:#aaa;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:all 0.2s;text-decoration:none}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.container{max-width:1400px;margin:0 auto;padding:1.5rem}
h1{font-size:1.5rem;margin-bottom:1.2rem;display:flex;align-items:center;gap:0.5rem}
.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap}
.filter-bar label{font-size:0.82rem;color:#aaa}
.filter-bar input[type=date]{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:0.4rem 0.6rem;border-radius:6px;font-size:0.82rem}
.filter-bar .btn{padding:0.4rem 0.9rem;border-radius:6px;font-size:0.8rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text);transition:all 0.2s}
.filter-bar .btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-bar .btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.quick-btns{display:flex;gap:0.4rem}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;text-align:center}
.kpi-card .value{font-size:1.7rem;font-weight:700;color:var(--accent)}
.kpi-card .label{font-size:0.78rem;color:#888;margin-top:0.3rem}
/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-wrap table{width:100%;border-collapse:collapse;font-size:0.83rem}
.table-wrap th{background:var(--bg2);padding:0.7rem 0.8rem;text-align:left;font-weight:600;color:#aaa;font-size:0.78rem;border-bottom:1px solid var(--border)}
.table-wrap td{padding:0.65rem 0.8rem;border-bottom:1px solid var(--border);vertical-align:top}
.table-wrap tr:hover{background:rgba(245,158,11,0.04)}
.badge{display:inline-block;padding:0.2rem 0.6rem;border-radius:20px;font-size:0.75rem;font-weight:600}
.badge-high{background:rgba(74,222,128,0.15);color:#4ade80}
.badge-mid{background:rgba(251,191,36,0.15);color:#fbbf24}
.badge-low{background:rgba(248,113,113,0.15);color:#f87171}
.interest-bar{display:inline-flex;align-items:center;gap:0.4rem;min-width:80px}
.interest-bar .bar{height:6px;border-radius:3px;background:var(--border);flex:1;position:relative;overflow:hidden}
.interest-bar .bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--accent)}
.chevron{cursor:pointer;transition:transform 0.2s;color:#666}
.chevron.open{transform:rotate(90deg);color:var(--accent)}
.detail-row{display:none;background:var(--bg2)}
.detail-row.show{display:table-row}
.detail-content{padding:1rem 1.5rem}
.detail-section{margin-bottom:0.8rem}
.detail-section h4{font-size:0.82rem;color:#aaa;margin-bottom:0.4rem}
.detail-section p{font-size:0.85rem;line-height:1.6}
.tag{display:inline-block;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);padding:0.15rem 0.5rem;border-radius:12px;font-size:0.72rem;margin:0.15rem}
.status-complete{color:#4ade80}
.status-review{color:#fbbf24}
.status-reject{color:#f87171}
.footer{text-align:center;padding:2rem;font-size:0.78rem;color:#666;border-top:1px solid var(--border);margin-top:2rem}
.footer a{color:var(--accent)}
@media(max-width:700px){
.nav{padding:0.5rem 0.8rem}
.nav-menu{width:100%;justify-content:center}
.container{padding:1rem 0.7rem}
.kpi-row{grid-template-columns:repeat(2,1fr)}
.filter-bar{flex-direction:column;align-items:stretch}
.table-wrap{overflow-x:auto}
}
</style>
</head>
<body>
<nav class="nav">
<div class="nav-brand">
<i class="fas fa-flask flask"></i>
<div class="titles">
<span class="main-t">경향신문 AI Newsroom Lab</span>
<span class="sub-t">Amazon Quick 실험실</span>
</div>
</div>
<div class="nav-menu">
<a href="kyunghyang-english.html" class="nav-btn">경향 영문</a>
<a href="k-culture.html" class="nav-btn">K-Culture</a>
<a href="editorial-standards.html" class="nav-btn">편집기준</a>
<a href="auto-translate.html" class="nav-btn active" style="background:rgba(245,158,11,0.12);border-color:#f59e0b;color:#f59e0b">자동번역</a>
</div>
</nav>
<div class="container">
<h1><i class="fas fa-language" style="color:var(--accent)"></i> 자동번역 대시보드</h1>
<div class="filter-bar">
<label>시작일</label><input type="date" id="startDate">
<label>종료일</label><input type="date" id="endDate">
<button class="btn primary" onclick="applyFilter()">조회</button>
<div class="quick-btns">
<button class="btn" onclick="setQuick('today')">오늘</button>
<button class="btn" onclick="setQuick('week')">이번주</button>
<button class="btn" onclick="setQuick('lastweek')">지난주</button>
<button class="btn" onclick="setQuick('month')">이번달</button>
</div>
</div>
<div class="kpi-row">
<div class="kpi-card"><div class="value" id="kTotal">-</div><div class="label">번역 기사(건)</div></div>
<div class="kpi-card"><div class="value" id="kInterest">-</div><div class="label">평균 관심도(/100)</div></div>
<div class="kpi-card"><div class="value" id="kQuality">-</div><div class="label">평균 품질(/100)</div></div>
<div class="kpi-card"><div class="value" id="kFK">-</div><div class="label">평균 FK(목표 8~12)</div></div>
<div class="kpi-card"><div class="value" id="kLocal">-</div><div class="label">현지화 적용(건)</div></div>
</div>
<div class="table-wrap">
<table>
<thead><tr><th></th><th>매체</th><th>관심도</th><th>품질</th><th>원본 제목 → 번역 제목</th><th>섹션</th><th>날짜</th><th>상태</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>
<footer class="footer">Made by mien.kim · Powered by Amazon Quick · <a href="https://github.com/mien-kim/article-quality" target="_blank">GitHub</a></footer>

<script>
var SUPABASE_KEY='sb_publishable_CKWybNK_oZPNMoE3S8mlrQ_5Rag4jS9';
var SUPABASE_URL='https://wwaflpepyrlfdcxvtscp.supabase.co';
var headers={'apikey':SUPABASE_KEY};

function cleanText(t){
if(!t)return '';
t=String(t);
t=t.replace(/기저/g,'기준');
t=t.replace(/젥문/g,'장문');
t=t.replace(/잡문/g,'장문');
t=t.replace(/놙음/g,'높음');
t=t.replace(/놙/g,'높');
t=t.replace(/랏랏랏동해얀/g,'');
t=t.replace(/랏/g,'·');
t=t.replace(/Â°/g,'°');
t=t.replace(/â€"/g,'—');
t=t.replace(/â€™/g,"'");
t=t.replace(/â€œ/g,'"');
t=t.replace(/â€\u009d/g,'"');
return t.trim();
}

function mediaLabel(m){
if(!m)return '-';
var lc=m.toLowerCase();
if(lc.includes('khan')||lc.includes('경향'))return '경향';
if(lc.includes('sports')||lc.includes('스경'))return '스경';
if(lc.includes('weekly')||lc.includes('주간'))return '주간';
if(lc.includes('lady')||lc.includes('레이디'))return '레이디';
return m;
}

function statusHtml(s){
if(!s)return '-';
var lc=s.toLowerCase();
if(lc.includes('완료')||lc.includes('complete')||lc.includes('done'))return '<span class="status-complete"><i class="fas fa-check-circle"></i> 완료</span>';
if(lc.includes('검토')||lc.includes('review'))return '<span class="status-review"><i class="fas fa-exclamation-circle"></i> 검토필요</span>';
if(lc.includes('반려')||lc.includes('reject'))return '<span class="status-reject"><i class="fas fa-times-circle"></i> 반려</span>';
return s;
}

function getWeekRange(){
var now=new Date(),day=now.getDay(),diff=now.getDate()-day+(day===0?-6:1);
var mon=new Date(now);mon.setDate(diff);mon.setHours(0,0,0,0);
var sun=new Date(mon);sun.setDate(mon.getDate()+6);
return{start:fmt(mon),end:fmt(sun)};
}
function fmt(d){return d.toISOString().slice(0,10)}
function setQuick(p){
var now=new Date(),s,e;
if(p==='today'){s=e=fmt(now)}
else if(p==='week'){var r=getWeekRange();s=r.start;e=r.end}
else if(p==='lastweek'){var r=getWeekRange();var ls=new Date(r.start);ls.setDate(ls.getDate()-7);var le=new Date(r.start);le.setDate(le.getDate()-1);s=fmt(ls);e=fmt(le)}
else if(p==='month'){s=fmt(new Date(now.getFullYear(),now.getMonth(),1));e=fmt(now)}
document.getElementById('startDate').value=s;
document.getElementById('endDate').value=e;
applyFilter();
}

var allData=[];
async function fetchData(){
var s=document.getElementById('startDate').value;
var e=document.getElementById('endDate').value;
var url=SUPABASE_URL+'/rest/v1/auto_translations?select=*&order=created_at.desc';
if(s)url+='&created_at=gte.'+s+'T00:00:00';
if(e)url+='&created_at=lte.'+e+'T23:59:59';
var resp=await fetch(url,{headers:headers});
allData=await resp.json();
if(!Array.isArray(allData))allData=[];
render();
}
function applyFilter(){fetchData()}

function render(){
var data=allData;
var total=data.length;
var interests=data.map(d=>d.interest_score||d.interest||0);
var qualities=data.map(d=>d.quality_score||d.quality||0);
var fks=data.map(d=>d.fk_score||d.fk_grade_level||0);
var localCount=data.filter(d=>{
var loc=d.localizations||d.localization_applied||[];
if(typeof loc==='string'){try{loc=JSON.parse(loc)}catch(e){loc=[]}}
return Array.isArray(loc)&&loc.length>0;
}).length;

var avgI=total?Math.round(interests.reduce((a,b)=>a+b,0)/total*10)/10:0;
var avgQ=total?Math.round(qualities.reduce((a,b)=>a+b,0)/total*10)/10:0;
var avgFK=total?Math.round(fks.reduce((a,b)=>a+b,0)/total*10)/10:0;

document.getElementById('kTotal').textContent=total;
document.getElementById('kInterest').textContent=avgI;
document.getElementById('kQuality').textContent=avgQ;
document.getElementById('kFK').textContent=avgFK;
document.getElementById('kLocal').textContent=localCount;

// Table
var tbody=document.getElementById('tableBody');
tbody.innerHTML='';
data.forEach(function(d,i){
var interest=d.interest_score||d.interest||0;
var quality=d.quality_score||d.quality||0;
var qCls=quality>=70?'badge-high':quality>=50?'badge-mid':'badge-low';
var origTitle=cleanText(d.original_title||d.title||'');
var transTitle=cleanText(d.translated_title||d.english_title||'');
var section=d.section||d.category||'-';
var date=(d.created_at||'').slice(0,10);
var status=d.status||'완료';
var media=mediaLabel(d.media||d.source||'');

var tr=document.createElement('tr');
tr.style.cursor='pointer';
tr.innerHTML='<td><i class="fas fa-chevron-right chevron" id="chev'+i+'"></i></td>'+
'<td>'+media+'</td>'+
'<td><div class="interest-bar"><span>'+interest+'</span><div class="bar"><div class="bar-fill" style="width:'+interest+'%"></div></div></div></td>'+
'<td><span class="badge '+qCls+'">'+quality+'</span></td>'+
'<td><span style="color:#aaa">'+origTitle+'</span><br>→ <strong>'+transTitle+'</strong></td>'+
'<td>'+section+'</td>'+
'<td>'+date+'</td>'+
'<td>'+statusHtml(status)+'</td>';
tr.onclick=function(){toggleDetail(i,d)};
tbody.appendChild(tr);

var dr=document.createElement('tr');
dr.className='detail-row';
dr.id='detail'+i;
dr.innerHTML='<td colspan="8"><div class="detail-content" id="detailContent'+i+'"></div></td>';
tbody.appendChild(dr);
});
}

function toggleDetail(i,d){
var dr=document.getElementById('detail'+i);
var chev=document.getElementById('chev'+i);
if(dr.classList.contains('show')){dr.classList.remove('show');chev.classList.remove('open');return}
chev.classList.add('open');dr.classList.add('show');
var cont=document.getElementById('detailContent'+i);

var preview=cleanText(d.translated_body||d.translated_content||d.body||'').slice(0,500);
var reason=cleanText(d.selection_reason||d.reason||'');
var locs=d.localizations||d.localization_applied||[];
if(typeof locs==='string'){try{locs=JSON.parse(locs)}catch(e){locs=[]}}
if(!Array.isArray(locs))locs=[];

var html='';
if(preview){
html+='<div class="detail-section"><h4><i class="fas fa-file-alt"></i> 번역 본문 미리보기</h4><p>'+preview+(preview.length>=500?'...':'')+'</p></div>';
}
if(locs.length>0){
html+='<div class="detail-section"><h4><i class="fas fa-globe-asia"></i> 현지화 적용</h4><div>';
locs.forEach(function(l){
var label=typeof l==='string'?l:(l.label||l.type||l.name||JSON.stringify(l));
html+='<span class="tag">'+cleanText(label)+'</span>';
});
html+='</div></div>';
}
if(reason){
html+='<div class="detail-section"><h4><i class="fas fa-lightbulb"></i> 선별 이유</h4><p>'+reason+'</p></div>';
}
if(!html)html='<p style="color:#888">상세 정보 없음</p>';
cont.innerHTML=html;
}

(function(){setQuick('week')})();
</script>
</body>
</html>
