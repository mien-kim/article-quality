<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>경향 영문기사 품질 대시보드</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/highcharts.js"></script>
<style>
:root{--bg:#1a1d23;--bg2:#22262e;--surface:#2a2f38;--border:#353a44;--text:#e4e7ec;--accent:#4fc3f7;--accent-dim:rgba(79,195,247,0.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
/* NAV */
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.7rem 1.5rem;display:flex;align-items:center;flex-wrap:wrap;gap:0.8rem}
.nav-brand{display:flex;align-items:center;gap:0.6rem;margin-right:auto}
.nav-brand .flask{font-size:1.4rem;color:var(--accent)}
.nav-brand .titles{display:flex;flex-direction:column}
.nav-brand .main-t{font-weight:700;font-size:1rem;color:var(--text)}
.nav-brand .sub-t{font-size:0.7rem;color:#888;margin-top:1px}
.nav-menu{display:flex;gap:0.4rem;flex-wrap:wrap}
.nav-btn{padding:0.45rem 1rem;border-radius:8px;font-size:0.82rem;font-weight:500;color:#aaa;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:all 0.2s;text-decoration:none}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
/* MAIN */
.container{max-width:1400px;margin:0 auto;padding:1.5rem}
h1{font-size:1.5rem;margin-bottom:1.2rem;display:flex;align-items:center;gap:0.5rem}
/* DATE FILTER */
.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap}
.filter-bar label{font-size:0.82rem;color:#aaa}
.filter-bar input[type=date]{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:0.4rem 0.6rem;border-radius:6px;font-size:0.82rem}
.filter-bar .btn{padding:0.4rem 0.9rem;border-radius:6px;font-size:0.8rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text);transition:all 0.2s}
.filter-bar .btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-bar .btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.quick-btns{display:flex;gap:0.4rem}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;text-align:center}
.kpi-card .value{font-size:1.7rem;font-weight:700;color:var(--accent)}
.kpi-card .label{font-size:0.78rem;color:#888;margin-top:0.3rem}
/* CHARTS */
.charts-row{display:grid;grid-template-columns:1fr 1.6fr;gap:1rem;margin-bottom:1.5rem}
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;min-height:300px}
/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-wrap table{width:100%;border-collapse:collapse;font-size:0.85rem}
.table-wrap th{background:var(--bg2);padding:0.75rem 0.8rem;text-align:left;font-weight:600;color:#aaa;font-size:0.78rem;border-bottom:1px solid var(--border)}
.table-wrap td{padding:0.7rem 0.8rem;border-bottom:1px solid var(--border);vertical-align:top}
.table-wrap tr:hover{background:rgba(79,195,247,0.04)}
.badge{display:inline-block;padding:0.2rem 0.6rem;border-radius:20px;font-size:0.75rem;font-weight:600}
.badge-high{background:rgba(74,222,128,0.15);color:#4ade80}
.badge-mid{background:rgba(251,191,36,0.15);color:#fbbf24}
.badge-low{background:rgba(248,113,113,0.15);color:#f87171}
.chevron{cursor:pointer;transition:transform 0.2s;color:#666}
.chevron.open{transform:rotate(90deg);color:var(--accent)}
.detail-row{display:none;background:var(--bg2)}
.detail-row.show{display:table-row}
.detail-content{padding:1rem 1.5rem}
.issue-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.8rem;margin-bottom:0.6rem}
.issue-item .desc{font-weight:600;margin-bottom:0.4rem;color:var(--text)}
.issue-item .before-after{display:grid;grid-template-columns:1fr auto 1fr;gap:0.5rem;align-items:start;font-size:0.82rem}
.issue-item .ba-label{font-size:0.7rem;color:#888;margin-bottom:0.2rem}
.issue-item .arrow{color:var(--accent);padding-top:1rem}
.issue-item .ba-box{background:var(--surface);padding:0.5rem 0.7rem;border-radius:6px;font-size:0.82rem;word-break:break-all}
/* FOOTER */
.footer{text-align:center;padding:2rem;font-size:0.78rem;color:#666;border-top:1px solid var(--border);margin-top:2rem}
.footer a{color:var(--accent)}
/* RESPONSIVE */
@media(max-width:700px){
.charts-row{grid-template-columns:1fr}
.nav{padding:0.5rem 0.8rem}
.nav-menu{width:100%;justify-content:center}
.container{padding:1rem 0.7rem}
.kpi-row{grid-template-columns:repeat(2,1fr)}
.filter-bar{flex-direction:column;align-items:stretch}
.table-wrap{overflow-x:auto}
}
</style>
</head>
<body>
<nav class="nav">
<div class="nav-brand">
<i class="fas fa-flask flask"></i>
<div class="titles">
<span class="main-t">경향신문 AI Newsroom Lab</span>
<span class="sub-t">Amazon Quick 실험실</span>
</div>
</div>
<div class="nav-menu">
<a href="kyunghyang-english.html" class="nav-btn active" style="--accent:#4fc3f7;background:rgba(79,195,247,0.12);border-color:#4fc3f7;color:#4fc3f7">경향 영문</a>
<a href="k-culture.html" class="nav-btn">K-Culture</a>
<a href="editorial-standards.html" class="nav-btn">편집기준</a>
<a href="auto-translate.html" class="nav-btn">자동번역</a>
</div>
</nav>
<div class="container">
<h1><i class="fas fa-globe" style="color:var(--accent)"></i> 경향 영문기사 품질 대시보드</h1>
<div class="filter-bar">
<label>시작일</label><input type="date" id="startDate">
<label>종료일</label><input type="date" id="endDate">
<button class="btn primary" onclick="applyFilter()">조회</button>
<div class="quick-btns">
<button class="btn" onclick="setQuick('today')">오늘</button>
<button class="btn" onclick="setQuick('week')">이번주</button>
<button class="btn" onclick="setQuick('lastweek')">지난주</button>
<button class="btn" onclick="setQuick('month')">이번달</button>
</div>
</div>
<div class="kpi-row">
<div class="kpi-card"><div class="value" id="kTotal">-</div><div class="label">분석 기사(건)</div></div>
<div class="kpi-card"><div class="value" id="kAvgScore">-</div><div class="label">평균 점수(/100)</div></div>
<div class="kpi-card"><div class="value" id="kAvgFK">-</div><div class="label">평균 FK(목표 8~12)</div></div>
<div class="kpi-card"><div class="value" id="kAbove70">-</div><div class="label">70점 이상</div></div>
<div class="kpi-card"><div class="value" id="kBelow60">-</div><div class="label">게시보류(&lt;60점)</div></div>
</div>
<div class="charts-row">
<div class="chart-box" id="chartDonut"></div>
<div class="chart-box" id="chartTrend"></div>
</div>
<div class="table-wrap">
<table id="mainTable">
<thead><tr><th></th><th>점수</th><th>제목 / 기자</th><th>FK</th><th>날짜</th><th>링크</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>
<footer class="footer">Made by mien.kim · Powered by Amazon Quick · <a href="https://github.com/mien-kim/article-quality" target="_blank">GitHub</a></footer>

<script>
var SUPABASE_KEY='sb_publishable_CKWybNK_oZPNMoE3S8mlrQ_5Rag4jS9';
var SUPABASE_URL='https://wwaflpepyrlfdcxvtscp.supabase.co';
var headers={'apikey':SUPABASE_KEY};

function cleanText(t){
if(!t)return '';
t=String(t);
t=t.replace(/기저/g,'기준');
t=t.replace(/젥문/g,'장문');
t=t.replace(/잡문/g,'장문');
t=t.replace(/놙음/g,'높음');
t=t.replace(/놙/g,'높');
t=t.replace(/랏랏랏동해얀/g,'');
t=t.replace(/랏/g,'·');
t=t.replace(/Â°/g,'°');
t=t.replace(/â€"/g,'—');
t=t.replace(/â€™/g,"'");
t=t.replace(/â€œ/g,'"');
t=t.replace(/â€\u009d/g,'"');
return t.trim();
}

function getWeekRange(){
var now=new Date(),day=now.getDay(),diff=now.getDate()-day+(day===0?-6:1);
var mon=new Date(now);mon.setDate(diff);mon.setHours(0,0,0,0);
var sun=new Date(mon);sun.setDate(mon.getDate()+6);
return{start:fmt(mon),end:fmt(sun)};
}
function fmt(d){return d.toISOString().slice(0,10)}
function setQuick(p){
var now=new Date(),s,e;
if(p==='today'){s=e=fmt(now)}
else if(p==='week'){var r=getWeekRange();s=r.start;e=r.end}
else if(p==='lastweek'){var r=getWeekRange();var ls=new Date(r.start);ls.setDate(ls.getDate()-7);var le=new Date(r.start);le.setDate(le.getDate()-1);s=fmt(ls);e=fmt(le)}
else if(p==='month'){s=fmt(new Date(now.getFullYear(),now.getMonth(),1));e=fmt(now)}
document.getElementById('startDate').value=s;
document.getElementById('endDate').value=e;
applyFilter();
}

var allData=[];
async function fetchData(){
var s=document.getElementById('startDate').value;
var e=document.getElementById('endDate').value;
var url=SUPABASE_URL+'/rest/v1/english_article_quality?source=eq.kh&select=*&order=created_at.desc';
if(s)url+='&created_at=gte.'+s+'T00:00:00';
if(e)url+='&created_at=lte.'+e+'T23:59:59';
var resp=await fetch(url,{headers:headers});
allData=await resp.json();
render();
}

function applyFilter(){fetchData()}

function render(){
var data=allData;
var total=data.length;
var scores=data.map(d=>d.score||0);
var fks=data.map(d=>d.fk_score||d.fk_grade_level||0);
var avg=total?Math.round(scores.reduce((a,b)=>a+b,0)/total*10)/10:0;
var avgFK=total?Math.round(fks.reduce((a,b)=>a+b,0)/total*10)/10:0;
var above70=scores.filter(s=>s>=70).length;
var below60=scores.filter(s=>s<60).length;
document.getElementById('kTotal').textContent=total;
document.getElementById('kAvgScore').textContent=avg;
document.getElementById('kAvgFK').textContent=avgFK;
document.getElementById('kAbove70').textContent=above70;
document.getElementById('kBelow60').textContent=below60;

// Donut
var bands=[{name:'90~100',y:scores.filter(s=>s>=90).length,color:'#4ade80'},{name:'70~89',y:scores.filter(s=>s>=70&&s<90).length,color:'#4fc3f7'},{name:'60~69',y:scores.filter(s=>s>=60&&s<70).length,color:'#fbbf24'},{name:'<60',y:scores.filter(s=>s<60).length,color:'#f87171'}];
Highcharts.chart('chartDonut',{chart:{type:'pie',backgroundColor:'transparent'},title:{text:'점수 분포',style:{color:'#e4e7ec',fontSize:'14px'}},plotOptions:{pie:{innerSize:'55%',dataLabels:{enabled:true,format:'{point.name}: {point.y}건',style:{color:'#ccc',fontSize:'11px'}}}},series:[{name:'건수',data:bands}],credits:{enabled:false}});

// Daily trend
var daily={};
data.forEach(function(d){
var day=(d.created_at||'').slice(0,10);
if(!day)return;
if(!daily[day])daily[day]={sum:0,cnt:0};
daily[day].sum+=(d.score||0);
daily[day].cnt++;
});
var days=Object.keys(daily).sort();
var avgSeries=days.map(function(k){return Math.round(daily[k].sum/daily[k].cnt*10)/10});
var cntSeries=days.map(function(k){return daily[k].cnt});
Highcharts.chart('chartTrend',{chart:{backgroundColor:'transparent'},title:{text:'일별 추이',style:{color:'#e4e7ec',fontSize:'14px'}},xAxis:{categories:days,labels:{style:{color:'#888',fontSize:'10px'},rotation:-45}},yAxis:[{title:{text:'평균 점수',style:{color:'#4fc3f7'}},labels:{style:{color:'#888'}}},{title:{text:'건수',style:{color:'#a78bfa'}},opposite:true,labels:{style:{color:'#888'}}}],series:[{name:'평균 점수',type:'line',data:avgSeries,color:'#4fc3f7'},{name:'건수',type:'column',yAxis:1,data:cntSeries,color:'rgba(167,139,250,0.5)'}],legend:{itemStyle:{color:'#aaa'}},credits:{enabled:false}});

// Table
var tbody=document.getElementById('tableBody');
tbody.innerHTML='';
data.forEach(function(d,i){
var sc=d.score||0;
var cls=sc>=70?'badge-high':sc>=60?'badge-mid':'badge-low';
var title=cleanText(d.title||d.headline||'');
var writer=cleanText(d.writer||d.author||'');
var fk=d.fk_score||d.fk_grade_level||'-';
var date=(d.created_at||'').slice(0,10);
var link=d.url||d.article_url||'#';
var tr=document.createElement('tr');
tr.style.cursor='pointer';
tr.innerHTML='<td><i class="fas fa-chevron-right chevron" id="chev'+i+'"></i></td><td><span class="badge '+cls+'">'+sc+'</span></td><td><strong>'+title+'</strong><br><span style="color:#888;font-size:0.78rem">'+writer+'</span></td><td>'+fk+'</td><td>'+date+'</td><td><a href="'+link+'" target="_blank">원문</a></td>';
tr.onclick=function(){toggleDetail(i,d)};
tbody.appendChild(tr);
var dr=document.createElement('tr');
dr.className='detail-row';
dr.id='detail'+i;
dr.innerHTML='<td colspan="6"><div class="detail-content" id="detailContent'+i+'">로딩중...</div></td>';
tbody.appendChild(dr);
});
}

async function toggleDetail(i,d){
var dr=document.getElementById('detail'+i);
var chev=document.getElementById('chev'+i);
if(dr.classList.contains('show')){dr.classList.remove('show');chev.classList.remove('open');return}
chev.classList.add('open');dr.classList.add('show');
var cont=document.getElementById('detailContent'+i);
// Fetch issues
var issues=[];
if(d.id){
var url=SUPABASE_URL+'/rest/v1/english_article_issues?article_id=eq.'+d.id+'&select=*';
var resp=await fetch(url,{headers:headers});
if(resp.ok)issues=await resp.json();
}
// Auto-generate issues
var autoIssues=[];
var fk=d.fk_score||d.fk_grade_level||0;
var sc=d.score||0;
if(fk>14)autoIssues.push({description:'FK 지수가 '+fk+'로 목표 범위(8~12)를 초과합니다. 문장을 짧게 분리하세요.',before:'FK = '+fk,after:'목표: 8~12'});
if(sc<60)autoIssues.push({description:'점수가 60점 미만으로 게시보류 대상입니다.',before:'Score = '+sc,after:'최소 60점 이상 필요'});
else if(sc<70)autoIssues.push({description:'점수가 70점 미만입니다. 개선 권고.',before:'Score = '+sc,after:'70점 이상 권장'});

var allIssues=issues.concat(autoIssues);
if(allIssues.length===0){cont.innerHTML='<p style="color:#888">이슈 없음</p>';return}
var html='';
allIssues.forEach(function(iss){
var before=cleanText(iss.before||iss.context||'');
var after=cleanText(iss.after||iss.replacement||'');
var desc=cleanText(iss.description||'');
html+='<div class="issue-item"><div class="desc">'+desc+'</div>';
if(before||after){
html+='<div class="before-after"><div><div class="ba-label">Before</div><div class="ba-box">'+before+'</div></div><div class="arrow"><i class="fas fa-arrow-right"></i></div><div><div class="ba-label">After</div><div class="ba-box">'+after+'</div></div></div>';
}
html+='</div>';
});
cont.innerHTML=html;
}

// Init
(function(){
setQuick('week');
})();
</script>
</body>
</html>
