<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kyunghyang English - 영문 기사 품질 분석</title>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/highcharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/modules/accessibility.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--border:#2a3a5e;--text:#e8e8e8;--text2:#a8b2c1;--text3:#6b7a8d;--accent:#4fc3f7;--green:#66bb6a;--yellow:#fdd835;--orange:#ff9800;--red:#ef5350;--purple:#ce93d8}
*{box-sizing:border-box}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);margin:0;padding:24px 32px;font-size:16px;line-height:1.6}
.nav{margin-bottom:20px}
.nav a{color:var(--accent);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.nav a:hover{text-decoration:underline}
h1{font-size:26px;font-weight:700;margin:0 0 4px}
h1 i{color:var(--accent);margin-right:8px}
.sub{color:var(--text3);font-size:14px;margin-bottom:20px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px;padding:14px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:10px}
.controls label{font-size:12px;color:var(--text3)}
.controls input[type=date],.controls select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;font-size:13px}
.controls button{background:var(--accent);color:#000;border:none;padding:7px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.controls button:hover{background:#81d4fa}
.quick-btns{display:flex;gap:6px}
.qb{padding:5px 11px;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;background:var(--bg);color:var(--text2)}
.qb.on{background:rgba(79,195,247,0.15);color:var(--accent);border-color:rgba(79,195,247,0.4)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.kpi-l{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3)}
.kpi-v{font-size:26px;font-weight:700;font-family:'SF Mono',Consolas,monospace;margin:3px 0}
.kpi-s{font-size:12px;color:var(--text2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.c{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}
.tbl-wrap{max-height:550px;overflow-y:auto;border-radius:10px;background:var(--bg2);border:1px solid var(--border);padding:14px}
table.m{width:100%;border-collapse:collapse;font-size:13px}
table.m th{text-align:left;color:var(--text3);font-weight:500;padding:9px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;position:sticky;top:0;background:var(--bg2);z-index:1}
table.m td{padding:9px;border-bottom:1px solid rgba(42,58,94,0.5);vertical-align:top}
table.m tr:hover td{background:rgba(79,195,247,0.05)}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-weight:700;font-size:12px;font-family:'SF Mono',Consolas,monospace}
.b-h{background:rgba(102,187,106,0.2);color:var(--green)}
.b-m{background:rgba(253,216,53,0.2);color:var(--yellow)}
.b-w{background:rgba(255,152,0,0.2);color:var(--orange)}
.b-l{background:rgba(239,83,80,0.2);color:var(--red)}
a.lnk{color:var(--accent);text-decoration:none;font-size:13px}
.loading{text-align:center;padding:50px;color:var(--text3);font-size:14px}
.empty{text-align:center;padding:40px;color:var(--text3)}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="nav"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> 메인으로</a></div>
<h1><i class="fa-solid fa-globe"></i>Kyunghyang English</h1>
<p class="sub">영문 기사 품질 분석 · FK Grade · 문장 구조 · 문화적 접근성 | Supabase 실시간 조회</p>

<div class="controls">
<label>시작일</label><input type="date" id="dateFrom">
<label>종료일</label><input type="date" id="dateTo">
<button onclick="loadData()">조회</button>
<div class="quick-btns">
<div class="qb" onclick="setRange('today')">오늘</div>
<div class="qb" onclick="setRange('week')">이번 주</div>
<div class="qb on" onclick="setRange('lastweek')">지난 주</div>
<div class="qb" onclick="setRange('month')">이번 달</div>
</div>
</div>

<div class="kpis">
<div class="kpi"><div class="kpi-l">분석 기사</div><div class="kpi-v" id="k-count">-</div><div class="kpi-s">건</div></div>
<div class="kpi"><div class="kpi-l">평균 점수</div><div class="kpi-v" id="k-avg">-</div><div class="kpi-s">/100</div></div>
<div class="kpi"><div class="kpi-l">평균 FK</div><div class="kpi-v" id="k-fk">-</div><div class="kpi-s">목표 8~12</div></div>
<div class="kpi"><div class="kpi-l">70점 이상</div><div class="kpi-v" id="k-pass">-</div><div class="kpi-s" id="k-pass-pct"></div></div>
<div class="kpi"><div class="kpi-l">게시보류</div><div class="kpi-v" id="k-hold">-</div><div class="kpi-s">&lt;60점</div></div>
</div>

<div class="g2">
<div class="c"><div id="chart-dist" style="height:220px"></div></div>
<div class="c"><div id="chart-daily" style="height:220px"></div></div>
</div>

<div class="tbl-wrap">
<table class="m">
<thead><tr><th>점수</th><th>제목 / 기자</th><th>FK</th><th>날짜</th><th>링크</th></tr></thead>
<tbody id="tbl"></tbody>
</table>
</div>

<div class="loading" id="loading" style="display:none">데이터 로딩 중...</div>
<div class="empty" id="empty" style="display:none">선택한 기간에 데이터가 없습니다.</div>

<script>
var SUPABASE_URL='https://wwaflpepyrlfdcxvtscp.supabase.co';
var SUPABASE_KEY='sb_publishable_CKWybNK_oZPNMoE3S8mlrQ_5Rag4jS9';
var allData=[];

function fmt(d){return d.toISOString().split('T')[0]}
function getLastWeek(){var now=new Date(),day=now.getDay()||7;var m=new Date(now);m.setDate(now.getDate()-day-6);var s=new Date(m);s.setDate(m.getDate()+6);return{from:fmt(m),to:fmt(s)}}

function setRange(r){
  document.querySelectorAll('.qb').forEach(function(b){b.classList.remove('on')});
  event.target.classList.add('on');
  var now=new Date(),f,t;
  if(r==='today'){f=t=fmt(now)}
  else if(r==='week'){var d=now.getDay()||7;f=fmt(new Date(now.getFullYear(),now.getMonth(),now.getDate()-d+1));t=fmt(now)}
  else if(r==='lastweek'){var lw=getLastWeek();f=lw.from;t=lw.to}
  else if(r==='month'){f=fmt(new Date(now.getFullYear(),now.getMonth(),1));t=fmt(now)}
  document.getElementById('dateFrom').value=f;
  document.getElementById('dateTo').value=t;
  loadData();
}

async function loadData(){
  var from=document.getElementById('dateFrom').value;
  var to=document.getElementById('dateTo').value;
  if(!from||!to)return;
  document.getElementById('loading').style.display='block';
  document.getElementById('tbl').innerHTML='';
  var url=SUPABASE_URL+'/rest/v1/english_article_quality?select=*&source=eq.kh&published_at=gte.'+from+'T00:00:00&published_at=lte.'+to+'T23:59:59&order=published_at.desc';
  try{var r=await fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});allData=await r.json()}catch(e){allData=[]}
  document.getElementById('loading').style.display='none';
  document.getElementById('empty').style.display=allData.length?'none':'block';
  render();
}

function render(){
  if(!allData.length){['k-count','k-avg','k-fk','k-pass','k-hold'].forEach(function(id){document.getElementById(id).textContent='-'});return}
  var avg=Math.round(allData.reduce(function(s,d){return s+d.score},0)/allData.length*10)/10;
  var fk=Math.round(allData.reduce(function(s,d){return s+(d.fk_grade||0)},0)/allData.length*10)/10;
  var pass=allData.filter(function(d){return d.score>=70}).length;
  var hold=allData.filter(function(d){return d.score<60}).length;
  document.getElementById('k-count').textContent=allData.length;
  document.getElementById('k-avg').textContent=avg;
  document.getElementById('k-avg').style.color=avg>=75?'#66bb6a':avg>=65?'#fdd835':'#ef5350';
  document.getElementById('k-fk').textContent=fk;
  document.getElementById('k-fk').style.color=fk<=12?'#66bb6a':fk<=14?'#ff9800':'#ef5350';
  document.getElementById('k-pass').textContent=pass;
  document.getElementById('k-pass-pct').textContent=Math.round(pass/allData.length*100)+'%';
  document.getElementById('k-hold').textContent=hold;

  // Pie
  var dist=[0,0,0,0];
  allData.forEach(function(d){if(d.score>=80)dist[0]++;else if(d.score>=70)dist[1]++;else if(d.score>=60)dist[2]++;else dist[3]++});
  Highcharts.chart('chart-dist',{chart:{type:'pie',backgroundColor:'transparent'},title:{text:'품질 분포',style:{fontSize:'14px',color:'#e8e8e8'}},plotOptions:{pie:{innerSize:'45%',dataLabels:{format:'<b>{point.name}</b> {point.y}건',style:{fontSize:'11px',color:'#a8b2c1',textOutline:'none'}}}},series:[{data:[{name:'우수80+',y:dist[0],color:'#66bb6a'},{name:'양호70-79',y:dist[1],color:'#fdd835'},{name:'개선60-69',y:dist[2],color:'#ff9800'},{name:'보류<60',y:dist[3],color:'#ef5350'}]}],credits:{enabled:false}});

  // Daily
  var daily={};allData.forEach(function(d){var day=d.published_at?d.published_at.split('T')[0]:'?';if(!daily[day])daily[day]={sum:0,cnt:0};daily[day].sum+=d.score;daily[day].cnt++});
  var days=Object.keys(daily).sort();
  Highcharts.chart('chart-daily',{chart:{backgroundColor:'transparent'},title:{text:'일별 추이',style:{fontSize:'14px',color:'#e8e8e8'}},xAxis:{categories:days.map(function(d){return d.slice(5)}),labels:{style:{color:'#6b7a8d'}},lineColor:'#2a3a5e'},yAxis:[{title:{text:null},min:50,max:90,gridLineColor:'#2a3a5e',labels:{style:{color:'#6b7a8d'}}},{title:{text:null},opposite:true,gridLineColor:'transparent',labels:{style:{color:'#6b7a8d'}}}],series:[{name:'평균',type:'spline',data:days.map(function(d){return Math.round(daily[d].sum/daily[d].cnt*10)/10}),color:'#4fc3f7',lineWidth:2.5},{name:'건수',type:'column',data:days.map(function(d){return daily[d].cnt}),color:'rgba(79,195,247,0.25)',yAxis:1}],legend:{itemStyle:{color:'#a8b2c1'}},credits:{enabled:false}});

  // Table
  document.getElementById('tbl').innerHTML=allData.map(function(d){
    var cls=d.score>=80?'b-h':d.score>=70?'b-m':d.score>=60?'b-w':'b-l';
    var dt=d.published_at?d.published_at.slice(5,16).replace('T',' '):'';
    return '<tr><td><span class="badge '+cls+'">'+d.score+'</span></td><td><span style="font-size:13px">'+d.title.slice(0,55)+'</span><br><span style="font-size:11px;color:#6b7a8d">'+(d.byline||'')+'</span></td><td style="font-family:monospace;color:'+(d.fk_grade<=12?'#66bb6a':d.fk_grade>14?'#ef5350':'#ff9800')+'">'+d.fk_grade+'</td><td style="font-size:12px;color:#6b7a8d;white-space:nowrap">'+dt+'</td><td><a class="lnk" href="'+d.url+'" target="_blank">원문</a></td></tr>';
  }).join('');
}

(function(){var lw=getLastWeek();document.getElementById('dateFrom').value=lw.from;document.getElementById('dateTo').value=lw.to;loadData()})();
</script>
</body>
</html>
